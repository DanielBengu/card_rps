<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card RPS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <h1>Card RPS</h1>
    </div>
    <div class="controls">
      <div class="tally">
        <span>W <b id="tw">0</b></span>
        <span>D <b id="td">0</b></span>
        <span>L <b id="tl">0</b></span>
      </div>
      <div class="temp">
        <label for="tempSlider">Opponent</label>
        <input id="tempSlider" type="range" min="0" max="100" step="1" value="50"
               aria-describedby="tempLabel">
        <span id="tempLabel" class="temp-label">Normal</span>
      </div>
      <button id="oddsBtn">Odds: on</button>
      <button id="newBtn" class="primary">New game</button>
    </div>
  </header>

  <div class="board">

    <section class="side">
      <div class="side-label">
        <span>Opponent's hand</span>
        <span class="pips" id="aiPips"></span>
      </div>
      <div class="row right" id="aiHand"></div>
    </section>

    <section class="side">
      <div class="side-label"><span id="poolLabel">Common pool</span></div>
      <div class="row center" id="pool"></div>
    </section>

    <div class="arena">
      <div class="arena-cards" id="arena">
        <div class="card ghost small"></div>
        <div class="vs">VS</div>
        <div class="card ghost small"></div>
      </div>
      <div class="status" id="status">Press <b>New game</b> to deal.</div>
      <div class="odds" id="oddsLine"></div>
    </div>

    <section class="side">
      <div class="side-label">
        <span>Your hand</span>
        <span class="pips" id="pPips"></span>
      </div>
      <div class="row" id="pHand"></div>
    </section>

  </div>

  <footer>
    Paper covers Rock &middot; Rock crushes Scissors &middot; Scissors cut Paper &middot; same type &rarr; higher number wins<br>
    Keys: <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> pick a card &middot; <kbd>N</kbd> new game
  </footer>

</div>

<script src="game.js" defer></script>
</body>
</html>
